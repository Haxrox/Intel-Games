version: 2
updates:
  # Maintain GitHub Actions in .github/workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "ci"
      include: "scope"
    open-pull-requests-limit: 10

  # Maintain root npm dependencies (includes firebase-tools, ws, serve, etc.)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      firebase:
        patterns:
          - "firebase*"
          - "@firebase/*"
          - "FirebaseExtended/*"
      dependencies:
        patterns:
          - "*"
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 10

  # Maintain local-server npm dependencies (includes firebase-admin, stockfish, etc.)
  - package-ecosystem: "npm"
    directory: "/local-server"
    schedule:
      interval: "weekly"
    groups:
      firebase:
        patterns:
          - "firebase*"
          - "@firebase/*"
      dependencies:
        patterns:
          - "*"
    commit-message:
      prefix: "chore(local-server-deps)"
    open-pull-requests-limit: 10
